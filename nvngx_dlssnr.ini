[DLSSNR_Proxy]
; Master toggle for the proxy
; 1 = Proxy enabled (applies ResolutionScale)
; 0 = Proxy disabled (100% native passthrough to real DLSS-NR)
EnableProxy = 1

; Internal model resolution scale (0.25 to 2.00)
; 2.00 = 200% Super-Sample (DLDSR / Photo Mode: 4x sample density)
; 1.50 = 150% Super-Sample (High-fidelity capture)
; 1.00 = 100% Native Passthrough
; 0.85 = 85% Resolution (~28% faster neural pass)
; 0.80 = 80% Resolution (~35% faster)
; 0.75 = 75% Resolution (~40% faster, recommended sweet spot)
; 0.67 = 67% Resolution (DLSS Quality ratio)
; 0.50 = 50% Resolution (DLSS Performance ratio)
ResolutionScale = 0.75

; [EXPERIMENTAL] Anamorphic / Asymmetric Neural Scaling (0 = Off, 1 = On, Default: 0)
; Scales horizontal and vertical resolution independently.
; When enabled, uses ResolutionScaleX and ResolutionScaleY instead of uniform ResolutionScale.
; 0.65x Horizontal / 0.85x Vertical yields ~45% neural load reduction with rock-solid frame pacing.
EnableAnamorphic = 0
ResolutionScaleX = 0.65
ResolutionScaleY = 0.85

; Resolve algorithm
; 1 = Matched Residual (1:1 Native Anchor + Neural Detail Transfer, Ultra Crisp, Recommended)
; 0 = Direct Neural Reconstruction Bilinear + RCAS
EnlargementMode = 1

; Strength of the neural detail transfer (0.0 to 2.0, default 1.0)
TransferStrength = 1.00

; Neural color/tint transfer strength (0.0 to 1.0, default 1.0)
; 1.00 = Full neural color transfer
; 0.00 = Hue-preserving luminance scaling (eliminates neural color shifts/tint
;        while keeping full lighting and detail; upstream 15f09dd)
ColorStrength = 1.00

; Contrast-adaptive edge sharpening (0.0 to 1.0, default 0.20)
Sharpness = 0.20

; Depth-Aware Bilateral Silhouette Preservation (0 = Off, 1 = On, Default: 1)
; Uses the native depth buffer to preserve crisp object silhouettes and geometric boundaries,
; preventing low-resolution neural radiance from bleeding across foreground edges.
EnableDepthAwareResolve = 1

; [EXPERIMENTAL] Alternating frame neural execution / VRNR (0 = Off, 1 = On, Default: 0)
; Evaluates DLSS-NR every 2nd frame for higher synthetic average FPS.
; WARNING: Causes 30Hz sawtooth frame pacing (choppy motion in camera pans) and visual flicker
; in games with native ray tracing / motion vectors. Keep 0 (OFF) for smooth gameplay.
EnableAlternatingFrames = 0

; CN fork 0.6.3: skip-frame anti-flicker for VRNR (0 = exact 0.6.2 behavior, 1 = On default)
; 0.7.1: temporal ramp now only engages after 2+ consecutive skip frames, so the
; alternating pattern no longer pulses the edit strength between 100% and 90%.
VrnrAntiFlicker = 1

; [EXPERIMENTAL] CN fork 0.7.1: skip-frame edit weight floor (0.00 to 1.00, Default: 0.60)
; On skipped frames the stale neural edit keeps at least this fraction even in moving
; regions, so it no longer collapses to zero and snaps back on the next inference frame
; (the main cause of character flicker with VRNR). Raise for steadier image, lower to
; reduce motion ghosting. 0 = disable the floor entirely.
VrnrWeightFloor = 0.60

; [EXPERIMENTAL] CN fork 0.7.1: motion-vector reprojection (0 = Off, 1 = On, Default: 1)
; Aligns the cached neural input to the current frame using the game's motion vectors
; before computing the luma difference. Removes the false "motion" detection caused by
; camera pans / character movement (stale input was compared against a misaligned frame).
; The alignment with the smaller difference wins, so MV sign conventions do not matter.
; Disable if any artifact appears with your game's motion vector format.
VrnrReproject = 1

; [EXPERIMENTAL] CN fork 0.7.3: frame-time adaptive strength (0 = Off, 1 = On, Default: 1)
; Pure CPU-side anti-pulse: when the smoothed FPS drops, inference frames have their
; neural edit dimmed so the visual gap to skip frames (which already use a reduced
; stale edit) shrinks. No new GPU resources. 0 = exact 0.7.1 behavior.
VrnrAdapt = 1

; [EXPERIMENTAL] CN fork 0.7.3: max dim fraction (0.00 to 1.00, Default: 0.60)
; How strongly inference frames are dimmed at very low FPS. 1.00 = at/below the low
; FPS threshold the neural edit is fully suppressed on inference frames.
VrnrAdaptAmount = 0.60

; [EXPERIMENTAL] CN fork 0.7.3: adaptive FPS window (Defaults: 45 / 25)
; Smoothstep ramp: dimming starts below VrnrAdaptFpsHi and reaches VrnrAdaptAmount
; at/below VrnrAdaptFpsLo. Above the hi threshold behavior is untouched.
VrnrAdaptFpsHi = 45
VrnrAdaptFpsLo = 25

; Enable in-game hotkeys
EnableHotkeys = 1

; CN fork: embedded in-game overlay panel
; EnableUi    = allow the Ctrl+Alt+<KeyToggleUI> panel toggle (default 1)
; UiLanguage  = 0 zh / 1 EN / 2 RU / 3 ko (switchable live in the panel header)
EnableUi = 1
UiLanguage = 0

[DLSSNR_Settings]
; Official NVIDIA DLSS-NR internal model tuning parameters.
; When UseCustomSettings = 0 (default), the proxy passes through whatever NR params
; the caller (OptiScaler, RenoDX, game engine) sets — our values below are ignored.
; Set to 1 to override the caller's NR settings with the values configured here.
UseCustomSettings = 0

; Style of neural reconstruction:
; 0 = Balanced (Default DLSS-NR tuning)
; 1 = Sharp (Crisp edges and heightened micro-contrast)
; 2 = Cinematic (Softer film roll-off with natural grain retention)
Style = 0

; Overall neural denoising and reconstruction intensity (0.00 to 2.00, default 1.00)
Intensity = 1.00

; Strength of high-frequency local geometry and structure preservation (0.00 to 2.00, default 1.00)
LocalStructureStrength = 1.00

; Strength of local HDR luminance contrast and tonal micro-transitions (0.00 to 2.00, default 1.00)
LocalToneStrength = 1.00

; Skin texture and human character structure preservation (-1.00 to 2.00, default -1.00)
; -1.00 = Auto (model dynamically infers human skin based on semantic heuristics)
SkinStructureStrength = -1.00

; Enable automatic internal heuristic masking for fast-moving or thin elements (0 = Off, 1 = On)
UseAutoMask = 0

[Hotkeys]
; Require Ctrl + Alt modifiers held down with the hotkey (1 = yes, 0 = no)
RequireCtrlAlt = 1

; Virtual-Key codes (Decimal):
; Space=32, PageUp=33, PageDown=34, End=35, Home=36, Insert=45, Delete=46
KeyToggleProxy = 32
KeyToggleMode = 35
KeyScaleUp = 33
KeyScaleDown = 34

; CN fork: overlay panel toggle combo (base key, always Ctrl+Alt + key)
KeyToggleUI = 122

[Governor]
; Master toggle for the dynamic FPS budget scale governor (0 = Off, 1 = On, Default: 0)
; Automatically adjusts the resolution scale in discrete 5% tiers to hold the target
; framerate: <95% target for 1.0s -> step down; >115% target for 3.0s -> step up;
; each step enters a cooldown dwell. Zero extra VRAM while disabled.
EnableGovernor = 0

; Target framerate budget in FPS (30 to 240, Default: 60.0)
TargetFps = 60.0

; Minimum allowable resolution scale clamp (0.25 to 2.00, Default: 0.50)
MinScale = 0.50

; Maximum allowable resolution scale clamp (0.25 to 2.00, Default: 1.00)
MaxScale = 1.00

; Minimum dwell cooldown between scale tier adjustments in seconds (0.5 to 10.0, Default: 2.0)
HysteresisSec = 2.0

; Frame Generation Target Mode (0 = Off, 1 = On, Default: 0)
; When enabled, TargetFps is applied to your final FrameGen display framerate rather than
; the base render engine framerate. Prevents unnecessary downscaling during gameplay when
; using frame generation (DLSS 3 / FSR 3 / Lossless Scaling LSFG 2x/3x/4x).
EnableFgMode = 0

; Frame Generation multiplier (1.0 to 10.0, Default: 2.0)
; Common values: 2.0 = DLSS 3 / FSR 3 / LSFG 2x; 3.0 = LSFG 3x; 4.0 = LSFG 4x.
FgMultiplier = 2.0
